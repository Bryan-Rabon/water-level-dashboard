<!DOCTYPE html>
<html>
<head>
    <title>Water Level Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #map { height: 400px; width: 100%; border-radius: 8px; margin-bottom: 20px; }
        .chart-container { width: 100%; height: 300px; }
    </style>
</head>
<body>
    <h2>Sensor Dashboard: <span id="site-display">Select a Site</span></h2>
    <div id="map"></div>
    <div class="chart-container">
        <canvas id="waterChart"></canvas>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

    <script>
        const map = L.map('map').setView([33.8, -80.9], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let waterChart; // Global variable to store the chart instance

        // 1. Map Data Setup
        const esriUrl = "https://services3.arcgis.com/iQDjAnwEnrAur0g1/ArcGIS/rest/services/scor_sites_Deployed/FeatureServer/0/query?where=1=1&outFields=*&f=geojson";

        fetch(esriUrl).then(res => res.json()).then(data => {
            L.geoJSON(data, {
                onEachFeature: (feature, layer) => {
                    const siteName = feature.properties.SITENAME;
                    layer.bindPopup(`<b>${siteName}</b><br><button onclick="updateChart('${siteName}')">View Last 7 Days</button>`);
                }
            }).addTo(map);
        });

        // 2. Chart Update Logic
        function updateChart(fullSiteName) {
            document.getElementById('site-display').innerText = fullSiteName;
            
            // Calculate Dates using Luxon
            const end = luxon.DateTime.now().toFormat('yyyy-MM-dd HH:mm:ss');
            const start = luxon.DateTime.now().minus({ days: 7 }).toFormat('yyyy-MM-dd HH:mm:ss');
            
            const apiUrl = `https://metadata.iriver.cloud/api/v1/scor/${fullSiteName}?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;

            fetch(apiUrl)
                .then(res => res.json())
                .then(apiData => {
                    // Extract timestamps and water_elevation_feet
                    const chartData = apiData.map(entry => ({
                        x: entry.timestamp,
                        y: entry.water_elevation_feet
                    }));

                    renderChart(chartData);
                })
                .catch(err => alert("Error fetching sensor data: " + err));
        }

        function renderChart(dataPoints) {
            const ctx = document.getElementById('waterChart').getContext('2d');
            
            // If chart exists, destroy it before creating a new one
            if (waterChart) { waterChart.destroy(); }

            waterChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Water Elevation (Feet)',
                        data: dataPoints,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: { unit: 'day' },
                            title: { display: true, text: 'Date' }
                        },
                        y: {
                            title: { display: true, text: 'Feet' }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
