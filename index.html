<!DOCTYPE html>
<html>
<head>
    <title>Water Level Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; border-radius: 8px; }
        .info-panel { padding: 10px; background: white; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h2>Sensor Location Dashboard</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        const map = L.map('map').setView([33.8, -80.9], 7); // Adjust to your area

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Fetch your ESRI Feature Layer
        const esriUrl = "https://services3.arcgis.com/iQDjAnwEnrAur0g1/ArcGIS/rest/services/scor_sites_Deployed/FeatureServer/0/query?where=1=1&outFields=*&f=geojson";

        fetch(esriUrl)
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: (feature, layer) => {
                        // Extract the first 8 characters of SITENAME
                        const fullSiteName = feature.properties.SITENAME || "Unknown";
                        const siteID = fullSiteName.substring(0, 8);

                        // Create a popup
                        layer.bindPopup(`
                            <strong>Site ID:</strong> ${siteID}<br>
                            <strong>Full Name:</strong> ${fullSiteName}<br>
                            <button onclick="fetchSensorData('${siteID}')">View Water Levels</button>
                        `);
                    }
                }).addTo(map);
            });

        function fetchSensorData(id) {
            console.log("Fetching data for site:", id);
            // This is where we will hook up your second API in the next step
            alert("Ready to pull data for: " + id);
        }
    </script>
</body>
</html>
