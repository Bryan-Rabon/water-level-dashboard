<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOR Station Analysis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1220; --surface: #111c2e; --surface2: #162032;
            --border: rgba(255,255,255,0.07); --accent: #00c8ff; --accent2: #00ffa3;
            --text: #e8edf5; --text-muted: #6b7fa3; --danger: #ff4757;
            --warning: #ffd32a; --radius: 12px; --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --recent: #00ffa3; --stale: #ffd32a; --none: #ff4757;
            --trend-up: #ff6b6b; --trend-down: #00ffa3; --trend-flat: #6b7fa3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0;
        }
        .app { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

        /* NAV */
        nav { display: flex; align-items: center; justify-content: space-between; background: #0d1626; border-bottom: 1px solid rgba(255,255,255,0.07); padding: 0 24px; height: 38px; flex-shrink: 0; }
        .nav-brand { font-family: 'Space Mono', monospace; font-size: 0.65em; color: #6b7fa3; letter-spacing: 0.15em; text-transform: uppercase; }
        .nav-links { display: flex; gap: 4px; }
        .nav-link { font-family: 'DM Sans', sans-serif; font-size: 0.78em; font-weight: 600; padding: 4px 14px; border-radius: 5px; text-decoration: none; color: #6b7fa3; border: 1px solid transparent; transition: all 0.15s; }
        .nav-link:hover { color: #e8edf5; border-color: rgba(255,255,255,0.1); }
        .nav-link.active { background: rgba(0,200,255,0.1); color: #00c8ff; border-color: rgba(0,200,255,0.3); }

        /* HEADER */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 12px; flex-wrap: wrap; }
        .header-left { display: flex; flex-direction: column; gap: 2px; }
        .header-eyebrow { font-family: 'Space Mono', monospace; font-size: 0.65em; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; }
        .header-title { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; }
        .header-title span { color: var(--accent); }
        .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .stat-pills { display: flex; gap: 6px; flex-wrap: wrap; }
        .stat-pill { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; transition: border-color 0.15s; }
        .stat-pill:hover { border-color: var(--accent); }
        .stat-pill.active-pill { border-color: var(--accent); background: rgba(0,200,255,0.08); }
        .pill-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .pill-count { font-family: 'Space Mono', monospace; font-size: 0.95em; font-weight: 700; }
        .pill-label { font-size: 0.68em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; }
        .live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,255,163,0.1); border: 1px solid rgba(0,255,163,0.25); color: var(--accent2); font-family: 'Space Mono', monospace; font-size: 0.65em; padding: 4px 10px; border-radius: 20px; }
        .live-dot { width: 6px; height: 6px; background: var(--accent2); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
        .clock { font-family: 'Space Mono', monospace; font-size: 0.72em; color: var(--text-muted); }

        /* MAIN */
        .main { display: grid; grid-template-columns: 1fr 380px; flex: 1; overflow: hidden; }
        #map { height: 100%; width: 100%; border-right: 1px solid var(--border); }
        .leaflet-tile { filter: brightness(0.75) saturate(0.6) hue-rotate(180deg); }
        .leaflet-control-zoom a { background: var(--surface2) !important; color: var(--text) !important; border-color: var(--border) !important; }

        /* SIDEBAR */
        .sidebar { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
        .sidebar-header { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .sidebar-header h4 { font-size: 0.7em; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
        .search-box { margin-top: 8px; position: relative; }
        .search-box input { width: 100%; padding: 7px 12px 7px 30px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.85em; outline: none; transition: border-color 0.2s; }
        .search-box input:focus { border-color: var(--accent); }
        .search-box svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .filter-tabs { display: flex; gap: 5px; padding: 8px 16px 0; flex-shrink: 0; flex-wrap: wrap; }
        .filter-tab { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 0.76em; cursor: pointer; transition: all 0.15s; }
        .filter-tab:hover { border-color: var(--accent); color: var(--accent); }
        .filter-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(0,200,255,0.08); }

        /* STATION LIST */
        .station-list { flex: 1; overflow-y: auto; padding: 8px 10px; }
        .station-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all 0.15s; margin-bottom: 3px; }
        .station-row:hover { background: var(--surface2); border-color: var(--border); }
        .station-row.active { background: rgba(0,200,255,0.06); border-color: rgba(0,200,255,0.2); }
        .station-indicator { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .station-info { flex: 1; min-width: 0; }
        .station-id { font-family: 'Space Mono', monospace; font-size: 0.82em; color: var(--text); font-weight: 700; }
        .station-meta { font-size: 0.72em; color: var(--text-muted); margin-top: 2px; }
        .station-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .station-badge { font-family: 'Space Mono', monospace; font-size: 0.64em; padding: 2px 7px; border-radius: 12px; font-weight: 700; white-space: nowrap; }
        .badge-recent { background: rgba(0,255,163,0.12); color: var(--recent); border: 1px solid rgba(0,255,163,0.25); }
        .badge-stale  { background: rgba(255,211,42,0.12); color: var(--stale);  border: 1px solid rgba(255,211,42,0.25); }
        .badge-none   { background: rgba(255,71,87,0.12);  color: var(--none);   border: 1px solid rgba(255,71,87,0.25); }
        .trend-arrow { font-size: 0.82em; font-weight: 700; font-family: 'Space Mono', monospace; }
        .trend-up   { color: var(--trend-up); }
        .trend-down { color: var(--trend-down); }
        .trend-flat { color: var(--trend-flat); }

        /* DETAIL PANEL */
        .detail-panel { border-top: 1px solid var(--border); flex-shrink: 0; max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .detail-panel.open { max-height: 320px; overflow-y: auto; }
        .detail-inner { padding: 12px 16px; }
        .detail-title { font-family: 'Space Mono', monospace; font-size: 0.78em; color: var(--accent); margin-bottom: 10px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .detail-subtitle { font-size: 0.65em; color: var(--text-muted); font-weight: 400; }

        /* PARAM ROWS with network comparison */
        .param-block { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .param-block:last-child { border-bottom: none; margin-bottom: 0; }
        .param-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .param-name { font-size: 0.8em; color: var(--text-muted); }
        .param-val { font-family: 'Space Mono', monospace; font-size: 0.88em; color: var(--text); font-weight: 700; }
        .param-trend { font-size: 0.72em; font-family: 'Space Mono', monospace; }
        .network-bar-wrap { height: 4px; background: var(--surface2); border-radius: 2px; position: relative; margin: 4px 0; }
        .network-bar-fill { height: 100%; border-radius: 2px; position: absolute; }
        .network-bar-site { width: 3px; height: 10px; border-radius: 2px; position: absolute; top: -3px; }
        .param-stats-row { display: flex; justify-content: space-between; font-size: 0.68em; color: var(--text-muted); margin-top: 3px; }

        /* POPUP */
        .leaflet-popup-content-wrapper { background: var(--surface) !important; border: 1px solid var(--border) !important; border-radius: 10px !important; box-shadow: var(--shadow) !important; color: var(--text) !important; }
        .leaflet-popup-tip { background: var(--surface) !important; }
        .popup-id { font-family: 'Space Mono', monospace; font-size: 0.9em; color: var(--accent); font-weight: 700; display: block; margin-bottom: 6px; }
        .popup-table { width: 100%; font-size: 0.82em; border-collapse: collapse; }
        .popup-table td { padding: 5px 4px; border-bottom: 1px solid var(--border); color: var(--text); }
        .popup-table td:last-child { text-align: right; font-family: 'Space Mono', monospace; color: var(--accent2); }

        /* LEGEND */
        .info.legend { padding: 10px 14px; background: var(--surface) !important; border: 1px solid var(--border) !important; border-radius: 8px; line-height: 22px; font-size: 12px; color: var(--text); font-family: 'DM Sans', sans-serif; box-shadow: var(--shadow) !important; }
        .info.legend i { width: 10px; height: 10px; float: left; margin-right: 8px; border-radius: 50%; margin-top: 6px; }

        /* LOADING */
        #loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 12px; }
        .loading-text { font-family: 'Space Mono', monospace; font-size: 0.8em; color: var(--accent); }
        .loading-bar-wrap { width: 200px; height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
        .loading-bar-inner { height: 100%; background: var(--accent); animation: loadbar 1.2s ease-in-out infinite; }
        @keyframes loadbar { 0%{width:0;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0;margin-left:100%} }

        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: var(--surface2); } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* MOBILE */
        @media (max-width: 700px) {
            .main { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
            #map { border-right: none; border-bottom: 1px solid var(--border); }
            .header { flex-direction: column; align-items: flex-start; padding: 10px 14px; gap: 8px; }
            .header-right { width: 100%; justify-content: space-between; }
            .clock { display: none; }
        }
    </style>
</head>
<body>
<div id="loading-overlay">
    <div class="loading-text">⟳ LOADING STATION DATA...</div>
    <div class="loading-bar-wrap"><div class="loading-bar-inner"></div></div>
</div>

<div class="app">
    <nav>
        <span class="nav-brand">SCOR Dashboard</span>
        <div class="nav-links">
            <a href="index2.html" class="nav-link" onmouseover="this.style.color='#e8edf5';this.style.borderColor='rgba(255,255,255,0.1)'" onmouseout="this.style.color='#6b7fa3';this.style.borderColor='transparent'">Water Level</a>
            <a href="analysis2.html" class="nav-link active">Station Analysis</a>
            <a href="trends.html" class="nav-link" onmouseover="this.style.color='#e8edf5';this.style.borderColor='rgba(255,255,255,0.1)'" onmouseout="this.style.color='#6b7fa3';this.style.borderColor='transparent'">Network Trends</a>
        </div>
    </nav>

    <div class="header">
        <div class="header-left">
            <div class="header-eyebrow">South Carolina Ocean &amp; Resources</div>
            <div class="header-title">SCOR <span>Station</span> Monitoring</div>
        </div>
        <div class="header-right">
            <div class="stat-pills">
                <div class="stat-pill" id="pill-recent" onclick="filterByPill('recent')">
                    <div class="pill-dot" style="background:var(--recent)"></div>
                    <span class="pill-count" id="count-recent">—</span>
                    <span class="pill-label">Recent</span>
                </div>
                <div class="stat-pill" id="pill-stale" onclick="filterByPill('stale')">
                    <div class="pill-dot" style="background:var(--stale)"></div>
                    <span class="pill-count" id="count-old">—</span>
                    <span class="pill-label">Stale</span>
                </div>
                <div class="stat-pill" id="pill-none" onclick="filterByPill('none')">
                    <div class="pill-dot" style="background:var(--none)"></div>
                    <span class="pill-count" id="count-none">—</span>
                    <span class="pill-label">No Data</span>
                </div>
            </div>
            <div class="live-badge"><div class="live-dot"></div>LIVE</div>
            <div class="clock" id="clock">--:--:-- UTC</div>
        </div>
    </div>

    <div class="main">
        <div id="map"></div>
        <div class="sidebar">
            <div class="sidebar-header">
                <h4>Station Status</h4>
                <div class="search-box">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" id="search-input" placeholder="Search station ID...">
                </div>
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="recent">Recent</button>
                <button class="filter-tab" data-filter="stale">Stale</button>
                <button class="filter-tab" data-filter="none">No Data</button>
            </div>
            <div class="station-list" id="station-list"></div>
            <div class="detail-panel" id="detail-panel">
                <div class="detail-inner" id="detail-inner"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function shortID(n) { return (n||'').trim().substring(0,8); }

function updateClock() {
    const n = new Date();
    document.getElementById('clock').textContent =
        String(n.getUTCHours()).padStart(2,'0')+':'+String(n.getUTCMinutes()).padStart(2,'0')+':'+String(n.getUTCSeconds()).padStart(2,'0')+' UTC';
}
setInterval(updateClock,1000); updateClock();

const map = L.map('map').setView([33.8361,-81.1637],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);

const esriUrl       = "https://services3.arcgis.com/iQDjAnwEnrAur0g1/ArcGIS/rest/services/scor_sites_Deployed/FeatureServer/0/query?where=1=1&outFields=*&f=geojson";
const summaryUrl    = "analysis/site_summary.json";
const networkUrl    = "analysis/network_health.json";
const paramStatsUrl = "analysis/parameter_stats.json";

let allStations=[], activeFilter='all', activeID=null;
const layerMap={};
let paramNetworkStats={};  // keyed by Parameter

Promise.all([
    fetch(esriUrl).then(r=>r.json()),
    fetch(summaryUrl).then(r=>r.json()),
    fetch(networkUrl).then(r=>r.json()),
    fetch(paramStatsUrl).then(r=>r.json())
]).then(([geoData, summaryData, healthData, paramData]) => {

    // Build parameter network stats lookup
    paramData.forEach(p => { paramNetworkStats[p.Parameter] = p; });

    // Build summary lookup keyed by 8-char site ID
    const statsLookup={};
    summaryData.forEach(item => {
        const key = shortID(item.SITE);
        if(!statsLookup[key]) statsLookup[key]=[];
        statsLookup[key].push(item);
    });

    // Build health lookup from network_health.json (pre-computed status)
    const healthLookup={};
    healthData.forEach(h => { healthLookup[shortID(h.SITE)] = h; });

    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7);
    let counts={recent:0,stale:0,none:0};

    L.geoJSON(geoData, {
        pointToLayer: (feature, latlng) => {
            const fullName  = (feature.properties.SITENAME||'Unknown').trim();
            const displayID = shortID(fullName);
            const siteData  = statsLookup[displayID];
            const health    = healthLookup[displayID];

            let color, status, lastDateStr='N/A';
            if(siteData && siteData.length>0) {
                const lastDate = new Date(siteData[0].last_sample);
                lastDateStr = siteData[0].last_sample;
                if(lastDate>=sevenDaysAgo){ color='#00ffa3'; status='recent'; counts.recent++; }
                else { color='#ffd32a'; status='stale'; counts.stale++; }
            } else { color='#ff4757'; status='none'; counts.none++; }

            // Compute dominant trend for this site (avg of all trend_deltas)
            let trendDelta = 0;
            if(siteData && siteData.length>0) {
                const deltas = siteData.map(s=>s.trend_delta||0).filter(d=>d!==null);
                trendDelta = deltas.length ? deltas.reduce((a,b)=>a+b,0)/deltas.length : 0;
            }

            allStations.push({ shortID:displayID, fullName, status, lastDateStr, siteData, health, latlng, color, trendDelta });
            const marker = L.circleMarker(latlng,{radius:8,fillColor:color,color:'rgba(255,255,255,0.25)',weight:2,fillOpacity:0.9});
            layerMap[displayID]=marker;

            // Popup
            let popup=`<span class="popup-id">${displayID}</span><hr style="border-color:rgba(255,255,255,0.08);margin:6px 0;">`;
            if(siteData){
                popup+=`<table class="popup-table">`;
                siteData.forEach(s=>{
                    const td = s.trend_delta!=null ? (s.trend_delta>0.01?'<span style="color:#ff6b6b">↑</span>':(s.trend_delta<-0.01?'<span style="color:#00ffa3">↓</span>':'<span style="color:#6b7fa3">→</span>')) : '';
                    popup+=`<tr><td>${s.Parameter}</td><td><b>${(+s.avg_result).toFixed(2)}</b> ${s.unit} ${td}</td></tr>`;
                });
                popup+=`</table>`;
            } else {
                popup+=`<span style="color:var(--text-muted);font-size:0.82em;">No analysis data.</span>`;
            }
            marker.bindPopup(popup,{maxWidth:240});
            marker.on('click',()=>selectStation(displayID));
            return marker;
        }
    }).addTo(map);

    document.getElementById('count-recent').textContent=counts.recent;
    document.getElementById('count-old').textContent=counts.stale;
    document.getElementById('count-none').textContent=counts.none;

    renderList(); addLegend();
    document.getElementById('loading-overlay').style.display='none';

}).catch(err=>{
    console.error('Error:',err);
    document.getElementById('loading-overlay').style.display='none';
});

function renderList() {
    const searchVal=document.getElementById('search-input').value.toLowerCase();
    const list=document.getElementById('station-list');
    list.innerHTML='';
    const filtered=allStations.filter(s=>{
        const mf=activeFilter==='all'||s.status===activeFilter;
        const ms=s.shortID.toLowerCase().includes(searchVal);
        return mf&&ms;
    });
    if(!filtered.length){ list.innerHTML=`<div style="color:var(--text-muted);font-size:0.82em;text-align:center;padding:24px 0;">No stations match.</div>`; return; }

    filtered.forEach(s=>{
        const row=document.createElement('div');
        row.className='station-row'+(s.shortID===activeID?' active':'');
        const bc=s.status==='recent'?'badge-recent':s.status==='stale'?'badge-stale':'badge-none';
        const bt=s.status==='recent'?'RECENT':s.status==='stale'?'STALE':'NO DATA';
        const pc=s.siteData?s.siteData.length:0;
        const ls=s.lastDateStr!=='N/A'?s.lastDateStr.substring(0,10):'—';

        // Trend arrow
        let trendHtml='';
        if(s.trendDelta>0.02) trendHtml=`<span class="trend-arrow trend-up">↑ HIGH</span>`;
        else if(s.trendDelta<-0.02) trendHtml=`<span class="trend-arrow trend-down">↓ LOW</span>`;
        else if(s.siteData&&s.siteData.length>0) trendHtml=`<span class="trend-arrow trend-flat">→</span>`;

        row.innerHTML=`
            <div class="station-indicator" style="background:${s.color}"></div>
            <div class="station-info">
                <div class="station-id">${s.shortID}</div>
                <div class="station-meta">${ls} &middot; ${pc} param${pc!==1?'s':''}</div>
            </div>
            <div class="station-right">
                <span class="station-badge ${bc}">${bt}</span>
                ${trendHtml}
            </div>`;
        row.addEventListener('click',()=>selectStation(s.shortID));
        list.appendChild(row);
    });
}

function selectStation(id) {
    activeID=id; renderList();
    const station=allStations.find(s=>s.shortID===id);
    if(!station) return;
    map.setView(station.latlng, Math.max(map.getZoom(),10));
    if(layerMap[id]) layerMap[id].openPopup();

    const panel=document.getElementById('detail-panel');
    const inner=document.getElementById('detail-inner');

    if(station.siteData && station.siteData.length>0) {
        const daysActive = station.siteData[0].days_active!=null ? Math.round(station.siteData[0].days_active)+' days active' : '';
        let html=`<div class="detail-title">${id} <span class="detail-subtitle">${daysActive}</span></div>`;

        station.siteData.forEach(s=>{
            const net = paramNetworkStats[s.Parameter];
            const avg = +s.avg_result, recentAvg = s.recent_avg!=null ? +s.recent_avg : null;
            const stddev = s.stddev!=null ? +s.stddev : null;
            const td = s.trend_delta!=null ? +s.trend_delta : 0;
            const trendClass = td>0.02?'trend-up':td<-0.02?'trend-down':'trend-flat';
            const trendLabel = td>0.02?`↑ +${td.toFixed(3)} vs baseline`:td<-0.02?`↓ ${td.toFixed(3)} vs baseline`:'→ near baseline';

            let networkBarHtml = '';
            if(net) {
                const nMin=+net.network_min, nMax=+net.network_max, nAvg=+net.network_avg;
                const range=nMax-nMin||1;
                const sitePct  = Math.min(100,Math.max(0,((avg-nMin)/range)*100)).toFixed(1);
                const avgPct   = Math.min(100,Math.max(0,((nAvg-nMin)/range)*100)).toFixed(1);
                networkBarHtml=`
                    <div style="font-size:0.65em;color:var(--text-muted);margin-top:5px;margin-bottom:2px;">NETWORK RANGE</div>
                    <div class="network-bar-wrap">
                        <div class="network-bar-fill" style="left:0;width:100%;background:var(--surface2);border-radius:2px;"></div>
                        <div class="network-bar-fill" style="left:${avgPct}%;width:2px;background:var(--text-muted);"></div>
                        <div class="network-bar-site" style="left:calc(${sitePct}% - 1px);background:${station.color};"></div>
                    </div>
                    <div class="param-stats-row">
                        <span>${(+net.network_min).toFixed(2)}</span>
                        <span style="color:var(--text-muted);">▲ net avg ${(+net.network_avg).toFixed(2)}</span>
                        <span>${(+net.network_max).toFixed(2)}</span>
                    </div>`;
            }

            html+=`
                <div class="param-block">
                    <div class="param-header">
                        <span class="param-name">${s.Parameter}</span>
                        <span class="param-val">${avg.toFixed(3)} <span style="font-size:0.75em;color:var(--text-muted);">${s.unit}</span></span>
                    </div>
                    <div class="param-trend ${trendClass}" style="font-size:0.72em;margin-bottom:4px;">${trendLabel}</div>
                    ${networkBarHtml}
                    <div class="param-stats-row" style="margin-top:6px;">
                        ${recentAvg!=null?`<span>7d avg: <b>${recentAvg.toFixed(3)}</b></span>`:''}
                        ${stddev!=null?`<span>σ ${stddev.toFixed(3)}</span>`:''}
                        <span>${s.reading_count!=null?s.reading_count.toLocaleString()+' readings':''}</span>
                    </div>
                </div>`;
        });
        inner.innerHTML=html;
    } else {
        inner.innerHTML=`<div class="detail-title">${id}</div><div style="color:var(--text-muted);font-size:0.82em;">No analysis data available.</div>`;
    }
    panel.classList.add('open');
}

// Clickable pills filter the list
function filterByPill(status) {
    const pills=['recent','stale','none'];
    pills.forEach(p=>{
        const el=document.getElementById('pill-'+p);
        if(el) el.classList.toggle('active-pill', p===status && activeFilter!==status);
    });
    activeFilter = activeFilter===status ? 'all' : status;
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.toggle('active', t.dataset.filter===activeFilter));
    renderList();
}

document.querySelectorAll('.filter-tab').forEach(btn=>{
    btn.addEventListener('click',function(){
        document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        activeFilter=this.dataset.filter;
        ['recent','stale','none'].forEach(p=>{ const el=document.getElementById('pill-'+p); if(el) el.classList.remove('active-pill'); });
        renderList();
    });
});
document.getElementById('search-input').addEventListener('input',renderList);

function addLegend() {
    const legend=L.control({position:'bottomright'});
    legend.onAdd=()=>{
        const div=L.DomUtil.create('div','info legend');
        div.innerHTML='<b style="font-family:\'Space Mono\',monospace;font-size:0.75em;letter-spacing:0.05em;">DATA STATUS</b><br>'+
            '<i style="background:#00ffa3"></i> Recent (&le;7d)<br>'+
            '<i style="background:#ffd32a"></i> Stale (&gt;7d)<br>'+
            '<i style="background:#ff4757"></i> No Data';
        return div;
    };
    legend.addTo(map);
}
